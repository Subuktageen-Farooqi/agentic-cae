[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-cae"
version = "0.1.0"
description = "Local, evidence-driven mechanical design workflow prototype"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]
cad = ["cadquery==2.6.1"]
ui = ["streamlit>=1.40,<2", "plotly>=5.24,<7", "trimesh>=4.5,<5"]
llm = ["google-genai>=1.0,<2"]

[project.scripts]
agentic-cae = "cli:main"

[tool.setuptools]
py-modules = ["schemas", "storage", "workflow", "config", "cli"]

[tool.setuptools.packages.find]
include = ["workers*", "rules*", "examples*", "rag*", "agents*", "providers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
