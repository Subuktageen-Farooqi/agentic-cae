[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-cae"
version = "0.1.0"
description = "Local, evidence-driven mechanical design workflow prototype"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.10,<3", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]
cad = ["cadquery==2.6.1"]
ui = ["streamlit>=1.40,<2", "plotly>=5.24,<7", "trimesh>=4.5,<5"]
llm = ["google-genai>=1.0,<2"]
fem = ["matplotlib>=3.9,<4"]

[project.scripts]
agentic-cae = "cli:main"

[tool.setuptools]
py-modules = ["schemas", "storage", "workflow", "config", "cli", "app", "app_logic", "reporting", "generation", "review", "fem_workflow", "app_views"]

[tool.setuptools.packages.find]
include = ["workers*", "rules*", "examples*", "rag*", "agents*", "providers*", "analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live_api'"
markers = ["real_integration: executes real installed CAD/FEM tools without provider or solver doubles", "live_api: opt-in paid/quota-consuming provider execution; never in default tests"]
